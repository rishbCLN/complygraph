services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-complygraph}
      POSTGRES_USER: ${POSTGRES_USER:-complygraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-complygraph_dev_pw}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-complygraph}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      # Container-network overrides (win over .env values that use localhost).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-complygraph}:${POSTGRES_PASSWORD:-complygraph_dev_pw}@postgres:5432/${POSTGRES_DB:-complygraph}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # Empty -> DemoConnector uses synthetic AsterLane data (no extra DB needed).
      DEMO_DATABASE_URL: ""
    ports:
      - "8000:8000"
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./apps/api
    command: ["./scripts/start-worker.sh"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-complygraph}:${POSTGRES_PASSWORD:-complygraph_dev_pw}@postgres:5432/${POSTGRES_DB:-complygraph}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DEMO_DATABASE_URL: ""
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  storage:
